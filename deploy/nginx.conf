# Place in nginx's http context (e.g. /etc/nginx/conf.d/lets-escape.conf).
# Replace the hostname and certificate paths with your own.
# Deliberately omit paths, queries, request lines, Referer, and tokens from logs.
log_format upload_redacted '$remote_addr [$time_local] $request_method $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=upload_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=upload_connections:10m;

server {
    listen 80;
    server_name upload.example.com;
    # Clients must use the HTTPS URL directly; do not redirect payload-bearing URLs.
    access_log /var/log/nginx/upload-access.log upload_redacted;
    error_log /dev/null crit;
    return 400;
}

server {
    listen 443 ssl;
    server_name upload.example.com;
    ssl_certificate /etc/letsencrypt/live/upload.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upload.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store, private, max-age=0" always;
    access_log /var/log/nginx/upload-access.log upload_redacted;
    # Nginx error messages can include the original request URL.
    error_log /dev/null crit;

    # 1 KiB raw chunks encode to 1,366 Base64URL characters. Application limit: 2,048 URL bytes.
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    limit_conn upload_connections 10;
    limit_req zone=upload_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_cache off;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        proxy_next_upstream off;
        proxy_hide_header Cache-Control;
    }
}
